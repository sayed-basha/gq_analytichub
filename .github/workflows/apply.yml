name: terraform-apply
on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      clean_room_name:
        description: 'Unique name for this clean room, e.g. "hospital_data" (required — identifies which room to create/update)'
        required: true
        type: string
      project_id:
        description: 'GCP project this clean room lives in (leave blank to use this repo''s default project)'
        required: false
        default: ""
        type: string
      dataset_id:
        required: false
        default: ""
        type: string
      source_table:
        required: false
        default: ""
        type: string
      privacy_unit_col:
        required: false
        default: ""
        type: string
      aggregation_threshold:
        required: false
        default: "50"
        type: string
      publisher_principal:
        required: false
        default: ""
        type: string
      subscriber_principal:
        required: false
        default: ""
        type: string
permissions:
  contents: write
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: terraform }
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - name: Build clean_rooms map
        id: rooms
        run: |
          name="${{ github.event.inputs.clean_room_name }}"
          if [ -z "$name" ]; then
            # No name given (e.g. a plain push to main) → just apply whatever's already checked into clean_rooms.auto.tfvars.json
            echo "clean_rooms={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          proj="${{ github.event.inputs.project_id }}"
          [ -z "$proj" ] && proj="${{ vars.GCP_PROJECT_ID }}"

          new_entry=$(jq -n \
            --arg project_id "$proj" \
            --arg location "${{ vars.DEFAULT_LOCATION }}" \
            --arg dataset_id "${{ github.event.inputs.dataset_id }}" \
            --arg source_table "${{ github.event.inputs.source_table }}" \
            --arg privacy_unit_col "${{ github.event.inputs.privacy_unit_col }}" \
            --argjson threshold ${{ github.event.inputs.aggregation_threshold || 50 }} \
            --arg pub "${{ github.event.inputs.publisher_principal }}" \
            --arg sub "${{ github.event.inputs.subscriber_principal }}" \
            '{
              project_id: $project_id, location: $location, dataset_id: $dataset_id,
              source_table: $source_table, privacy_unit_col: $privacy_unit_col,
              aggregation_threshold: $threshold,
              publishers: (if $pub != "" then [$pub] else [] end),
              subscribers: (if $sub != "" then [$sub] else [] end)
            }')

          # Merge into the checked-in file: if the room already exists, merge new
          # publishers/subscribers into its lists instead of replacing them.
          merged=$(jq --arg name "$name" --argjson entry "$new_entry" '
            .clean_rooms[$name] as $existing |
            .clean_rooms[$name] = (
              if $existing == null then $entry
              else $existing
                | .publishers += $entry.publishers | .publishers |= unique
                | .subscribers += $entry.subscribers | .subscribers |= unique
                | (if $entry.dataset_id != "" then .dataset_id = $entry.dataset_id else . end)
                | (if $entry.source_table != "" then .source_table = $entry.source_table else . end)
                | (if $entry.privacy_unit_col != "" then .privacy_unit_col = $entry.privacy_unit_col else . end)
                | .aggregation_threshold = $entry.aggregation_threshold
              end
            ) | .clean_rooms' clean_rooms.auto.tfvars.json)

          echo "clean_rooms=$(echo "$merged" | jq -c .)" >> "$GITHUB_OUTPUT"

      - run: |
          terraform apply -auto-approve \
            -var='clean_rooms=${{ steps.rooms.outputs.clean_rooms }}'
      - name: Persist clean room config back to repo
        if: github.event.inputs.clean_room_name != ''
        run: |
          echo '${{ steps.rooms.outputs.clean_rooms }}' | jq '{clean_rooms: .}' > clean_rooms.auto.tfvars.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clean_rooms.auto.tfvars.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist clean room '${{ github.event.inputs.clean_room_name }}' [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to persist"
          fi