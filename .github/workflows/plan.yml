name: terraform-plan
on:
  pull_request:
    paths: ["terraform/**"]

permissions:
  contents: read
  id-token: write   # required for WIF

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: terraform }
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: |
          terraform plan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="dataset_id=${{ vars.DEFAULT_DATASET_ID }}" \
            -var="source_table=${{ vars.DEFAULT_SOURCE_TABLE }}" \
            -var="privacy_unit_col=${{ vars.DEFAULT_PRIVACY_UNIT_COL }}" \
            -var='publishers=["group:data-eng@company.com"]' \
            -var='subscribers=["group:partner-analysts@partner.com"]'